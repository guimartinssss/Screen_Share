<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <title>Screen Share - PC</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { text-align: center; background: #111; color: #fff; font-family: Arial, Helvetica, sans-serif; padding: 20px; }
    video { width: 80%; margin: 10px 0; background: #000; border-radius: 10px; max-height: 45vh; }
    img { margin-top: 20px; border: 4px solid white; border-radius: 10px; max-width: 300px; }
    #videos { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Screen Share</h1>
  <p>Abre este site no PC e escaneia o QR com o telemóvel (ou partilha o link):</p>
  <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code">
  <p>Link da sessão: <code id="link">http://{{ request.host }}/session/{{ session_id }}</code></p>

  <div id="videos">
    <h3>📱 Tela do telemóvel</h3>
    <video id="screenVideo" autoplay playsinline></video>
    <h3>🎥 Câmara do telemóvel</h3>
    <video id="cameraVideo" autoplay playsinline></video>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/static/script.js"></script>
  <script>
    const pcPage = true;
    const sessionId = "{{ session_id }}";
    startConnection(pcPage, sessionId);
  </script>
</body>
</html>
